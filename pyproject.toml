[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cdolf-multiling_jd060"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对多语言模型工程师·长上下文的位置编码外推相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cdolf" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cdolf.github.io"
Repository = "https://github.com/cdolf/multiling_jd060"
Issues = "https://github.com/cdolf/multiling_jd060/issues"

[project.scripts]
multiling_jd060 = "multiling_jd060:main"

[tool.setuptools]
py-modules = ["multiling_jd060"]
